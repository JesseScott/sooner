name: Build

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Caches Gradle and validates the wrapper jar.
      - uses: gradle/actions/setup-gradle@v4

      # The runner image ships the Android SDK. No TransLink key is needed:
      # BuildConfig.TRANSLINK_API_KEY is empty when local.properties is absent.
      - name: Build and unit test
        run: ./gradlew assembleDebug testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
